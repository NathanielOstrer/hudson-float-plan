<title>Hudson Float Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0EE; --surface:#FBFCFB; --sunk:#E3E8E5;
  --ink:#141C1A; --ink-2:#3C4A46; --muted:#5B6A66; --faint:#8A9793;
  --line:#CBD5D0; --line-2:#DDE4E1;
  --accent:#B01D6B; --accent-soft:#F7E4EE;
  --flood:#15607F; --flood-soft:#D9E9F0;
  --ebb:#9A5A12; --ebb-soft:#F3E6D3;
  --caution:#8C6A00; --caution-soft:#F6EDD2;
  --stop:#A32B1E; --stop-soft:#F7E1DE;
  --ok:#2A6B4A;
  --shadow:0 1px 2px rgba(20,28,26,.05), 0 8px 24px -16px rgba(20,28,26,.35);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1417; --surface:#151D21; --sunk:#101819;
    --ink:#E3EAE7; --ink-2:#C2CFCB; --muted:#94A5A0; --faint:#6E807B;
    --line:#2A363B; --line-2:#212C31;
    --accent:#F0629F; --accent-soft:#331726;
    --flood:#5BB6D6; --flood-soft:#12262F;
    --ebb:#DFA05A; --ebb-soft:#2B2013;
    --caution:#D6A62B; --caution-soft:#2A2311;
    --stop:#E8705F; --stop-soft:#301715;
    --ok:#5FBF8E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1417; --surface:#151D21; --sunk:#101819;
  --ink:#E3EAE7; --ink-2:#C2CFCB; --muted:#94A5A0; --faint:#6E807B;
  --line:#2A363B; --line-2:#212C31;
  --accent:#F0629F; --accent-soft:#331726;
  --flood:#5BB6D6; --flood-soft:#12262F;
  --ebb:#DFA05A; --ebb-soft:#2B2013;
  --caution:#D6A62B; --caution-soft:#2A2311;
  --stop:#E8705F; --stop-soft:#301715;
  --ok:#5FBF8E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;text-wrap:balance;margin:0}

.wrap{max-width:680px;margin:0 auto;padding:0 14px 72px}

/* ---------- masthead ---------- */
.masthead{padding:26px 0 18px;border-bottom:1px solid var(--line)}
.flag{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
h1{font-size:27px;font-weight:700;letter-spacing:-.024em;line-height:1.08}
.flag .hull{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600;font-family:"IBM Plex Mono",monospace}
.masthead p{margin:9px 0 0;color:var(--muted);font-size:13.5px;max-width:56ch}

/* ---------- sections ---------- */
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 15px 17px;margin-top:14px;box-shadow:var(--shadow)}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:13px}
h2{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.src{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-family:"IBM Plex Mono",monospace;text-align:right;flex:none;white-space:nowrap}
.src.auto{color:var(--flood)}

/* ---------- fields ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:1/-1}
@media (max-width:430px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{
  font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;min-width:0}
input[type=date],input[type=time],input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:60px;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

/* ---------- forecast status + paste ---------- */
.fcstline{margin:0 0 12px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.fcstline.live{color:var(--flood)}
.fcstline.stale{color:var(--caution)}
.fcstline.none{color:var(--faint)}
.paste-wrap{border-top:1px solid var(--line-2);padding-top:11px;margin-top:13px}
.paste-wrap summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;
  display:flex;align-items:center;gap:8px}
.paste-wrap summary::-webkit-details-marker{display:none}
.paste-wrap summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);
  border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;flex:none}
.paste-wrap[open] summary::before{transform:rotate(90deg)}
.paste-wrap .paste{margin-top:11px;margin-bottom:0}

.paste{background:var(--sunk);border:1px solid var(--line-2);border-radius:8px;padding:11px}
.paste textarea{background:var(--surface);min-height:66px;font-size:14px}
.readback{margin:9px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.readback.hit{color:var(--flood);font-weight:500}
.readback.miss{color:var(--caution)}
.srclinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srclinks a{font-size:12px;font-family:"IBM Plex Mono",monospace;text-decoration:none;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.srclinks a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- readouts ---------- */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--line-2);
  border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-top:12px}
.ro{background:var(--surface);padding:8px 10px}
.ro dt{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.ro dd{margin:2px 0 0;font-size:16px;font-weight:500;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ro dd small{font-size:11px;color:var(--muted);font-weight:400}

.evrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--sunk);font-family:"IBM Plex Mono",monospace}
.ev .t{font-weight:600}
.ev.flood{color:var(--flood);border-color:color-mix(in srgb,var(--flood) 35%,transparent);background:var(--flood-soft)}
.ev.ebb{color:var(--ebb);border-color:color-mix(in srgb,var(--ebb) 35%,transparent);background:var(--ebb-soft)}
.ev.slack{color:var(--muted)}

/* ---------- current strip ---------- */
figure{margin:14px 0 0}
.strip{width:100%;height:auto;display:block;border:1px solid var(--line-2);border-radius:8px;background:var(--sunk)}
figcaption{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.key{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--muted)}
.key i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}

.wcell{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.loading{opacity:.45;transition:opacity .2s}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:13px;border:1px solid var(--line-2);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--sunk);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tr.opposing{background:var(--caution-soft)}
.dirmark{font-weight:600;font-family:"IBM Plex Mono",monospace}
.dirmark.flood{color:var(--flood)} .dirmark.ebb{color:var(--ebb)} .dirmark.slack{color:var(--muted)}

/* ---------- recommendation ---------- */
.rec{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--surface)}
.rec .shead h2{color:var(--accent)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:12px 14px}
.callout .lead{font-family:Archivo,sans-serif;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.callout .why{margin:7px 0 0;font-size:13.5px;color:var(--ink-2)}
.steps{list-style:none;padding:0;margin:13px 0 0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:58px 1fr;gap:11px;padding:9px 0;border-top:1px solid var(--line-2);align-items:baseline}
.steps li:first-child{border-top:0}
.steps .when{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.steps .what{font-size:14px}
.steps .what em{font-style:normal;font-weight:600}

.flags{display:flex;flex-direction:column;gap:7px;margin-top:13px}
.flag-item{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45;
  padding:9px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--sunk)}
.flag-item .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px}
.flag-item.stop{background:var(--stop-soft);border-color:color-mix(in srgb,var(--stop) 30%,transparent)}
.flag-item.stop .tag{background:var(--stop);color:#fff}
.flag-item.caution{background:var(--caution-soft);border-color:color-mix(in srgb,var(--caution) 30%,transparent)}
.flag-item.caution .tag{background:var(--caution);color:#fff}
.flag-item.note .tag{background:var(--line);color:var(--ink-2)}
.flag-item.clear{color:var(--ok)}
.flag-item.clear .tag{background:var(--ok);color:#fff}

/* ---------- rose ---------- */
.rose-row{display:flex;gap:14px;align-items:center;margin-top:13px;flex-wrap:wrap}
.rose{flex:none}
.rose-text{font-size:13px;color:var(--ink-2);min-width:180px;flex:1}
.rose-text strong{font-weight:600}

footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.55}
footer a{color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  section{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
}
</style>
