name: Refresh conditions

# Every three hours. The minute is offset off the hour because GitHub's
# scheduler is congested at :00 and delays or drops runs there.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

# A slow run and the next scheduled run must not both push.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push with a personal access token, not GITHUB_TOKEN. GitHub disables
          # a scheduled workflow after 60 days with no repository activity, and a
          # GITHUB_TOKEN commit does not reset that timer. A PAT commit does.
          token: ${{ secrets.REFRESH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read NOAA and the NWS
        run: python generate.py

      - name: Build the page
        run: python build.py

      - name: Commit the new data
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "nothing changed"
            exit 0
          fi
          # Author as the account that owns REFRESH_TOKEN, not as the bot. The
          # 60-day inactivity timer keys off real user activity, and a bot-authored
          # commit leaves that ambiguous. The noreply address keeps a private email
          # out of roughly 2,900 automated commits a year.
          git config user.name "NathanielOstrer"
          git config user.email "4533775+NathanielOstrer@users.noreply.github.com"
          git add docs
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
