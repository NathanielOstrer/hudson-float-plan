name: Tests

# A data commit touches docs/ only, so it must not start a test run.
on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generator tests
        run: python -m unittest discover -s tests -t .

      - name: Client model tests
        run: node --test tests/*.test.js

      - name: The built page is in step with src/
        run: |
          python build.py
          git diff --exit-code docs/index.html
